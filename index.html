<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Locali - Sommariva del Bosco</title>
    <style>
        /* Variabili di colore: Modalità Scura (Default) */
        :root {
            --page-bg: #000000;
            --widget-bg: #11151e;
            --widget-border: #1f2533;
            --text-main: #ffffff;
            --text-sec: #9ca3af;
            --accent-blue: #38bdf8;
            --accent-orange: #f59e0b;
        }

        /* Variabili di colore: Modalità Chiara */
        body.light-mode {
            --page-bg: #ffffff;
            --widget-bg: #f8fafc;
            --widget-border: #e2e8f0;
            --text-main: #0f172a;
            --text-sec: #64748b;
            --accent-blue: #0284c7;
            --accent-orange: #d97706;
        }

        /* Layout generale e centramento */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--page-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 1s ease;
        }

        /* Wrapper per la scala e il centramento sul LEDwall */
        #scaler {
            width: 1240px;
            height: 700px;
            transform: scale(0.55);
            transform-origin: center;
            display: flex;
        }

        /* Stile del Widget principale */
        #widget-container {
            position: relative; /* Necessario per posizionare la fonte in basso a destra */
            width: 100%;
            height: 100%;
            background-color: var(--widget-bg);
            border: 2px solid var(--widget-border);
            border-radius: 32px;
            padding: 40px 45px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 1s ease;
        }

        /* Intestazione su una riga */
        #header {
            margin-bottom: 40px;
            font-size: 46px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1;
        }

        #header .blue-text {
            color: var(--accent-blue);
        }

        #header .white-text {
            color: var(--text-main);
        }

        /* Area contenuti e transizioni */
        #content-area {
            flex: 1;
            display: flex;
            gap: 45px; /* Spazio tra foto e testo */
            align-items: flex-start;
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
            padding-left: 10px; /* Sposta foto leggermente a sinistra */
        }

        .fade-out {
            opacity: 0 !important;
        }

        /* Immagine della notizia (più piccola) */
        #news-image-wrapper {
            width: 400px;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background-color: var(--widget-border);
            margin-top: 10px; /* Allinea leggermente la foto con il testo */
        }

        #news-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Testo della notizia */
        #news-text-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Titolo ingrandito e ottimizzato */
        #news-title {
            font-size: 54px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.15;
            margin-bottom: 25px;
            display: -webkit-box;
            -webkit-line-clamp: 4; /* Fino a 4 righe per il titolo */
            line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Descrizione con più righe leggibili */
        #news-description {
            font-size: 28px;
            color: var(--text-sec);
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 5; /* Ora mostra fino a 5 righe di contenuto */
            line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Etichetta della Fonte spostata in basso a destra del rettangolo */
        #news-source {
            position: absolute;
            bottom: 35px;
            right: 45px;
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        /* Puntino estetico prima della fonte */
        #news-source::before {
            content: "(•)";
            font-size: 20px;
            color: var(--text-sec);
        }

        /* Mostra la fonte quando il contenuto è visibile */
        .show-content {
            opacity: 1 !important;
        }

        #loading-message {
            font-size: 32px;
            color: var(--text-sec);
            text-align: center;
            width: 100%;
            font-weight: 500;
            margin-top: 100px;
        }
    </style>
</head>
<body>

<div id="scaler">
    <div id="widget-container">
        
        <div id="header">
            <span class="blue-text">SOMMARIVA DEL BOSCO</span> <span class="white-text">- NEWS LOCALI</span>
        </div>
        
        <div id="content-area">
            <div id="loading-message">Sincronizzazione notizie in corso...</div>
            
            <div id="news-image-wrapper" style="display: none;">
                <img id="news-image" src="" alt="">
            </div>
            
            <div id="news-text-wrapper" style="display: none;">
                <div id="news-title">Titolo</div>
                <div id="news-description">Descrizione...</div>
            </div>
        </div>

        <!-- Fonte ancorata in basso a destra del widget-container -->
        <div id="news-source">Fonte</div>

    </div>
</div>

<script>
    // Gestione Tema Chiaro/Scuro in base all'ora
    function updateTheme() {
        const hour = new Date().getHours();
        if (hour >= 7 && hour < 19) {
            document.body.classList.add('light-mode');
        } else {
            document.body.classList.remove('light-mode');
        }
    }
    
    updateTheme();
    setInterval(updateTheme, 60000);

    const rssFeeds = [
        { name: "TargatoCN", url: "https://www.targatocn.it/rss.xml" },
        { name: "Gazzetta d'Alba", url: "https://www.gazzettadalba.it/feed/" },
        { name: "IdeaWebTV", url: "https://www.ideawebtv.it/feed/" },
        { name: "Cuneo24", url: "https://www.cuneo24.it/feed/" },
        { name: "La Guida", url: "https://www.laguida.it/feed/" }
    ];

    let newsItems = [];
    let currentIndex = 0;
    const DISPLAY_DURATION = 30000; // 30 secondi

    const contentArea = document.getElementById('content-area');
    const elSource = document.getElementById('news-source'); // Fonte gestita con una sua transizione
    const loadingMessage = document.getElementById('loading-message');
    const imageWrapper = document.getElementById('news-image-wrapper');
    const textWrapper = document.getElementById('news-text-wrapper');
    
    const elImage = document.getElementById('news-image');
    const elTitle = document.getElementById('news-title');
    const elDesc = document.getElementById('news-description');

    function cleanHTML(html) {
        let tmp = document.createElement("DIV");
        tmp.innerHTML = html;
        return (tmp.textContent || tmp.innerText || "").trim();
    }

    function extractImage(item) {
        if (item.thumbnail && item.thumbnail.trim() !== "") return item.thumbnail;
        if (item.enclosure && item.enclosure.link && item.enclosure.type.startsWith('image/')) return item.enclosure.link;
        const imgRegex = /<img[^>]+src="?([^"\s]+)"?[^>]*>/g;
        let match = imgRegex.exec(item.content || item.description);
        if (match && match[1]) return match[1];
        return "https://images.unsplash.com/photo-1504711434969-e33886168f5c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80";
    }

    async function fetchAllNews() {
        let tempNews = [];

        for (const feed of rssFeeds) {
            try {
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok') {
                    const items = data.items.slice(0, 3); 
                    items.forEach(item => {
                        tempNews.push({
                            source: feed.name,
                            title: item.title,
                            description: cleanHTML(item.description),
                            image: extractImage(item),
                            pubDate: new Date(item.pubDate)
                        });
                    });
                }
            } catch (error) {
                console.error("Errore feed:", feed.name);
            }
        }

        if (tempNews.length > 0) {
            tempNews.sort((a, b) => b.pubDate - a.pubDate);
            newsItems = tempNews.slice(0, 15);
            currentIndex = 0;
            showNews();
        } else {
            loadingMessage.innerHTML = "Notizie non disponibili al momento.";
        }
    }

    function showNews() {
        if (newsItems.length === 0) return;

        const currentNews = newsItems[currentIndex];
        loadingMessage.style.display = 'none';
        
        // Dissolvenza in uscita sia per l'area contenuto che per la fonte
        contentArea.classList.add('fade-out');
        elSource.classList.remove('show-content');

        setTimeout(() => {
            // Aggiorna i dati mentre sono invisibili
            elImage.src = currentNews.image;
            elSource.textContent = "Fonte: " + currentNews.source;
            elTitle.textContent = currentNews.title;
            elDesc.textContent = currentNews.description;

            imageWrapper.style.display = 'block';
            textWrapper.style.display = 'flex';

            // Dissolvenza in entrata per contenuto e fonte
            contentArea.classList.remove('fade-out');
            elSource.classList.add('show-content');

            currentIndex++;
            if (currentIndex >= newsItems.length) currentIndex = 0;
            
        }, 800); 
    }

    fetchAllNews();
    setInterval(showNews, DISPLAY_DURATION);
    setInterval(fetchAllNews, 3600000);

</script>

</body>
</html>
