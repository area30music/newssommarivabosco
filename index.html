<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - Sommariva del Bosco</title>
    <style>
        /* Variabili di colore: Modalità Scura (Stile iOS Dark) */
        :root {
            --page-bg: #000000;
            --widget-bg: #1c1c1e;
            --widget-border: #2c2c2e;
            --text-main: #ffffff;
            --text-sec: #98989d;
            --accent-blue: #0a84ff;
            --accent-orange: #ff9f0a;
        }

        /* Variabili di colore: Modalità Chiara (Stile iOS Light) */
        body.light-mode {
            --page-bg: #f2f2f7;
            --widget-bg: #ffffff;
            --widget-border: #e5e5ea;
            --text-main: #000000;
            --text-sec: #8e8e93;
            --accent-blue: #007aff;
            --accent-orange: #ff9500;
        }

        /* Layout generale e centramento */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--page-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 1s ease;
        }

        #scaler {
            width: 1240px;
            height: 700px;
            transform: scale(0.55);
            transform-origin: center;
            display: flex;
        }

        #widget-container {
            position: relative; 
            width: 100%;
            height: 100%;
            background-color: var(--widget-bg);
            border: 2px solid var(--widget-border);
            border-radius: 32px;
            padding: 40px 45px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 1s ease;
        }

        #header {
            margin-bottom: 35px;
            font-size: 46px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1;
        }

        #header .blue-text { color: var(--accent-blue); transition: color 1s ease; }
        #header .white-text { color: var(--text-main); transition: color 1s ease; }

        #content-area {
            flex: 1;
            display: flex;
            gap: 45px; 
            align-items: center; 
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
            padding-left: 10px;
            overflow: hidden; 
        }

        .fade-out { opacity: 0 !important; }

        #news-image-wrapper {
            width: 440px;
            height: 400px; 
            border-radius: 20px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background-color: var(--widget-border);
            transition: border-color 1s ease, background-color 1s ease;
        }

        #news-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #news-text-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            padding-right: 20px;
            height: 400px; /* Esattamente l'altezza della foto per sfruttare lo spazio tra le linee rosse */
            overflow: hidden;
        }

        #news-title {
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.15;
            display: -webkit-box;
            -webkit-line-clamp: 6;
            line-clamp: 6;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 1s ease, font-size 0.3s ease;
        }

        #news-source {
            position: absolute;
            bottom: 40px;
            left: 55px; 
            font-size: 26px;
            font-weight: 700;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.8s ease-in-out, color 1s ease;
        }

        #news-source::before {
            content: "(•)";
            font-size: 18px;
            color: var(--text-sec);
            transition: color 1s ease;
        }

        .show-content { opacity: 1 !important; }

        #loading-message {
            font-size: 32px;
            color: var(--text-sec);
            text-align: center;
            width: 100%;
            font-weight: 500;
            margin-top: 100px;
            transition: color 1s ease;
        }
    </style>
</head>
<body>

<div id="scaler">
    <div id="widget-container">
        
        <div id="header">
            <span class="blue-text">SOMMARIVA DEL BOSCO</span> <span class="white-text">- NEWS</span>
        </div>
        
        <div id="content-area">
            <div id="loading-message">Sincronizzazione notizie in corso...</div>
            
            <div id="news-image-wrapper" style="display: none;">
                <img id="news-image" src="" alt="" onerror="this.src='https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80'">
            </div>
            
            <div id="news-text-wrapper" style="display: none;">
                <div id="news-title">Titolo</div>
            </div>
        </div>

        <div id="news-source">Fonte</div>

    </div>
</div>

<script>
    function updateTheme() {
        const hour = new Date().getHours();
        if (hour >= 7 && hour < 19) {
            document.body.classList.add('light-mode');
        } else {
            document.body.classList.remove('light-mode');
        }
    }
    
    updateTheme();
    setInterval(updateTheme, 60000);

    const rssFeeds = [
        { name: "TargatoCN", url: "https://www.targatocn.it/rss.xml", limit: 4 },
        { name: "Gazzetta d'Alba", url: "https://www.gazzettadalba.it/feed/", limit: 4 },
        { name: "IdeaWebTV", url: "https://www.ideawebtv.it/feed/", limit: 4 },
        { name: "La Guida", url: "https://www.laguida.it/feed/", limit: 3 }
    ];

    let newsItems = [];
    let currentIndex = 0;
    const DISPLAY_DURATION = 15000; 

    const contentArea = document.getElementById('content-area');
    const elSource = document.getElementById('news-source');
    const loadingMessage = document.getElementById('loading-message');
    const imageWrapper = document.getElementById('news-image-wrapper');
    const textWrapper = document.getElementById('news-text-wrapper');
    const elImage = document.getElementById('news-image');
    const elTitle = document.getElementById('news-title');

    const spamKeywords = [
        "dottore", "dott.", "dott.ssa", "medico", "farmacia", "poliambulatorio", 
        "visita specialistica", "pubblicità", "promozione", "sponsorizzato", 
        "offerta", "sconto", "commerciale", "marketing", "dentista", "clinica"
    ];

    function cleanHTML(html) {
        if (!html) return "";
        let tmp = document.createElement("DIV");
        tmp.innerHTML = html;
        return (tmp.textContent || tmp.innerText || "").trim();
    }

    function formatTitle(title, sourceName) {
        let clean = cleanHTML(title);
        clean = clean.replace(/\s*[-|]\s*[a-zA-Z0-9.-]+\.[a-zA-Z]{2,5}$/i, '');
        clean = clean.replace(/\s*[-|]\s*[A-Z][a-zA-Z\s]+$/i, '');
        return clean.trim();
    }

    function isAdOrSpam(title, description) {
        let content = (title + " " + description).toLowerCase();
        return spamKeywords.some(keyword => content.includes(keyword));
    }

    function isDuplicate(newTitle, existingNews) {
        let newWords = newTitle.toLowerCase().split(/\W+/).filter(w => w.length > 4);
        for (let item of existingNews) {
            let existingWords = item.title.toLowerCase().split(/\W+/).filter(w => w.length > 4);
            let matches = 0;
            for (let word of newWords) {
                if (existingWords.includes(word)) matches++;
            }
            if (matches >= 3 && newWords.length > 0) return true;
        }
        return false;
    }

    // GENERATORE INTELLIGENTE DI IMMAGINI A TEMA (SPECIFICO PER CALCIO, CIBO, POLITICA E CULTURA)
    function getSmartImageByTitle(title) {
        let t = title.toLowerCase();
        if (/calcio|partita|mister|serie|fbc|fc|sport|sconfitta|vittoria|gol|squadra|giocatori|asta|fossano|albese|saluzzo|varese|cellevarazze/i.test(t)) {
            return "https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=800&q=80"; // Campo da calcio / Stadio reale
        } else if (/cibo|mangiare|slow|vino|tartufo|mercato|prodotti|sapori|ristorante|cucina|fiera|degustazione|cuneo|alba|bra|bra's|formaggio/i.test(t)) {
            return "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80"; // Cibo / Mercato / Gastronomia
        } else if (/comune|sindaco|regione|politica|consiglio|amministrazione|ente|provincia|elezioni|trifolao|schlein|meloni|conte|bonelli/i.test(t)) {
            return "https://images.unsplash.com/photo-1540910419892-4a36d2c3266c?auto=format&fit=crop&w=800&q=80"; // Politica / Istituzionale
        } else if (/premio|carriera|vittorio|feltri|cinema|teatro|libri|mostra|artista|concerto|spettacolo/i.test(t)) {
            return "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=800&q=80"; // Spettacolo / Eventi / Cultura
        } else {
            return "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80"; // Territorio / Paesaggio
        }
    }

    function extractImage(item, title) {
        let imgUrl = "";
        
        if (item.thumbnail && item.thumbnail.trim() !== "") {
            imgUrl = item.thumbnail;
        } else if (item.enclosure && item.enclosure.link && item.enclosure.type && item.enclosure.type.startsWith('image/')) {
            imgUrl = item.enclosure.link;
        } else {
            const imgRegex = /<img[^>]+src="?([^"\s]+)"?[^>]*>/g;
            let match = imgRegex.exec(item.content || item.description);
            if (match && match[1]) imgUrl = match[1];
        }

        // Filtro rigoroso per bloccare immagini mancanti, pixel, errori o il blocco "hotlinked" (divieto)
        if (!imgUrl || imgUrl.length < 10 || /feedburner|1x1|pixel|tracker|blank|hotlinked|stop|error|warning|default/i.test(imgUrl)) {
            return getSmartImageByTitle(title);
        }
        return imgUrl;
    }

    async function fetchAllNews() {
        let tempNews = [];

        for (const feed of rssFeeds) {
            try {
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok') {
                    const items = data.items.slice(0, feed.limit); 
                    
                    items.forEach(item => {
                        let rawText = item.content ? item.content : item.description;
                        let cleanText = cleanHTML(rawText);
                        let cleanTitle = formatTitle(item.title, feed.name);
                        
                        if (isAdOrSpam(cleanTitle, cleanText)) return;
                        if (isDuplicate(cleanTitle, tempNews)) return;
                        
                        tempNews.push({
                            source: feed.name,
                            title: cleanTitle,
                            image: extractImage(item, cleanTitle),
                            pubDate: new Date(item.pubDate)
                        });
                    });
                }
            } catch (error) {
                console.error("Errore feed:", feed.name);
            }
        }

        if (tempNews.length > 0) {
            tempNews.sort((a, b) => b.pubDate - a.pubDate);
            newsItems = tempNews.slice(0, 15);
            currentIndex = 0;
            showNews();
        } else {
            loadingMessage.innerHTML = "Notizie non disponibili al momento.";
        }
    }

    function showNews() {
        if (newsItems.length === 0) return;

        const currentNews = newsItems[currentIndex];
        loadingMessage.style.display = 'none';
        
        contentArea.classList.add('fade-out');
        elSource.classList.remove('show-content');

        setTimeout(() => {
            elImage.src = currentNews.image;
            elSource.textContent = "Fonte: " + currentNews.source;
            elTitle.textContent = currentNews.title;

            // SCALA DIMENSIONE FONT POTENZIATA (Sfrutta al massimo lo spazio verticale tra le linee rosse)
            let len = currentNews.title.length;
            if (len < 35) {
                elTitle.style.fontSize = "62px"; 
            } else if (len < 65) {
                elTitle.style.fontSize = "52px"; 
            } else if (len < 100) {
                elTitle.style.fontSize = "42px"; 
            } else if (len < 145) {
                elTitle.style.fontSize = "36px"; 
            } else {
                elTitle.style.fontSize = "30px"; 
            }

            imageWrapper.style.display = 'block';
            textWrapper.style.display = 'flex';

            contentArea.classList.remove('fade-out');
            elSource.classList.add('show-content');

            currentIndex++;
            if (currentIndex >= newsItems.length) currentIndex = 0;
            
        }, 800); 
    }

    fetchAllNews();
    setInterval(showNews, DISPLAY_DURATION);
    setInterval(fetchAllNews, 3600000); 

</script>

</body>
</html>
