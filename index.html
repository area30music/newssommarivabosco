<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - Sommariva del Bosco</title>
    <style>
        :root {
            --page-bg: #000000;
            --widget-bg: #1c1c1e;
            --widget-border: #2c2c2e;
            --text-main: #ffffff;
            --text-sec: #98989d;
            --accent-blue: #0a84ff;
            --accent-orange: #ff9f0a;
        }

        body.light-mode {
            --page-bg: #e5e5ea; 
            --widget-bg: #ffffff;
            --widget-border: #d1d1d6;
            --text-main: #000000;
            --text-sec: #8e8e93;
            --accent-blue: #007aff;
            --accent-orange: #ff9500;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--page-bg);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #widget-container {
            position: relative;
            width: 96vw;  
            height: 94vh; 
            background-color: var(--widget-bg);
            border: 0.4vw solid var(--widget-border);
            border-radius: 4vh;
            padding: 4.5vh 4vw;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2vh 5vh rgba(0, 0, 0, 0.3);
        }

        #header {
            margin-bottom: 2.5vh;
            font-size: 5.5vh;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.1vw;
            line-height: 1;
        }

        #header .blue-text { color: var(--accent-blue); }
        #header .white-text { color: var(--text-main); }

        #content-area {
            flex: 1;
            display: flex;
            align-items: center; 
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
            overflow: hidden; 
        }

        .fade-out { opacity: 0 !important; }

        #news-image-wrapper {
            width: 36vw; 
            height: 58vh; 
            border-radius: 3vh;
            overflow: hidden;
            flex-shrink: 0;
            margin-right: 4vw;
            background-color: var(--widget-border);
        }

        #news-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #news-text-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            height: 58vh; 
            overflow: hidden;
            padding-right: 18vw; 
        }

        #news-category {
            display: inline-block;
            font-size: 2.2vh;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-blue);
            background-color: rgba(10, 132, 255, 0.12);
            padding: 0.6vh 1.2vw;
            border-radius: 1vh;
            margin-bottom: 1.5vh;
            width: fit-content;
        }

        /* ANTI-TAGLIO: Permette al testo di adattarsi senza troncare con i puntini */
        #news-title {
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.15;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: clip; /* Rimuove i puntini di sospensione */
        }

        #news-meta {
            position: absolute;
            bottom: 3.5vh;
            left: 4vw; 
            display: flex;
            align-items: center;
        }

        #news-source {
            font-size: 3vh;
            font-weight: 700;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            gap: 0.8vw;
        }

        #news-source::before {
            content: "(•)";
            font-size: 2vh;
            color: var(--text-sec);
        }

        #news-date {
            font-size: 2.8vh;
            font-weight: 600;
            color: var(--text-main);
            margin-left: 2.5vw;
        }

        /* QR CODE GRANDE */
        #qr-container {
            position: absolute;
            bottom: 2.2vh;
            right: 4vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;
            padding: 1.6vh 1.6vw;
            border-radius: 2.2vh;
            box-shadow: 0 0.8vh 2.5vh rgba(0,0,0,0.3);
        }

        #qr-code {
            width: 20vh;  
            height: 20vh;
            object-fit: contain;
        }

        #qr-label {
            font-size: 2.1vh; 
            font-weight: 800;
            color: #000000;
            margin-top: 0.8vh;
            text-transform: uppercase;
        }

        #progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0.8vh;
            background-color: transparent;
            border-bottom-left-radius: 4vh;
            border-bottom-right-radius: 4vh;
            overflow: hidden;
        }

        #progress-bar {
            width: 100%;
            height: 100%;
            background-color: var(--accent-blue);
            transform-origin: left;
            transform: scaleX(0);
            transition: transform linear;
        }
    </style>
</head>
<body>

<div id="widget-container">
    <div id="header">
        <span class="blue-text">SOMMARIVA DEL BOSCO</span> <span class="white-text">- NEWS</span>
    </div>
    
    <div id="content-area">
        <div id="news-image-wrapper">
            <img id="news-image" src="" alt="News">
        </div>
        
        <div id="news-text-wrapper">
            <div id="news-category">Territorio</div>
            <div id="news-title">Caricamento notizie in corso...</div>
        </div>
    </div>

    <div id="news-meta">
        <div id="news-source">Sommariva News</div>
        <div id="news-date"></div>
    </div>

    <div id="qr-container">
        <img id="qr-code" src="" alt="QR">
        <div id="qr-label">Leggi</div>
    </div>

    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>
</div>

<script>
    function updateTheme() {
        const hour = new Date().getHours();
        if (hour >= 7 && hour < 19) document.body.classList.add('light-mode');
        else document.body.classList.remove('light-mode');
    }
    updateTheme();
    setInterval(updateTheme, 60000);

    let newsItems = [
        {
            source: "Sommariva News",
            category: "Territorio",
            title: "Aggiornamenti in tempo reale dal comune e dalle iniziative del territorio di Sommariva del Bosco",
            image: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=800&q=80",
            link: "https://www.comune.sommarivadelbosco.cn.it/",
            pubDate: new Date()
        }
    ];

    let currentIndex = 0;
    const DISPLAY_DURATION = 15000; 
    let loopInterval = null;

    const contentArea = document.getElementById('content-area');
    const elImage = document.getElementById('news-image');
    const elCategory = document.getElementById('news-category');
    const elTitle = document.getElementById('news-title');
    const elSource = document.getElementById('news-source');
    const elDate = document.getElementById('news-date');
    const elQrCode = document.getElementById('qr-code');
    const progressBar = document.getElementById('progress-bar');

    function formatFriendlyDate(dateStr) {
        if (!dateStr) return "";
        const dateObj = new Date(dateStr);
        if (isNaN(dateObj)) return "";
        const now = new Date();
        const diffHours = Math.floor((now - dateObj) / (1000 * 60 * 60));
        if (diffHours < 1) return "Pubblicato poco fa";
        if (diffHours < 24 && now.getDate() === dateObj.getDate()) {
            return `Oggi alle ${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
        }
        if (diffHours < 48) return "Ieri";
        return `${dateObj.getDate()}/${dateObj.getMonth() + 1}/${dateObj.getFullYear()}`;
    }

    function showNews() {
        if (newsItems.length === 0) return;
        if (currentIndex >= newsItems.length) currentIndex = 0;

        const currentNews = newsItems[currentIndex];
        
        contentArea.classList.add('fade-out');

        setTimeout(() => {
            elImage.src = currentNews.image;
            elCategory.textContent = currentNews.category;
            elSource.textContent = "Fonte: " + currentNews.source;
            elDate.textContent = formatFriendlyDate(currentNews.pubDate);
            elTitle.textContent = currentNews.title;
            
            // Gestione automatica della dimensione del font in base alla lunghezza del titolo per evitare tagli
            let len = currentNews.title.length;
            if (len < 35) {
                elTitle.style.fontSize = "7.2vh";
                elTitle.style.webkitLineClamp = "3";
            } else if (len < 70) {
                elTitle.style.fontSize = "6.0vh";
                elTitle.style.webkitLineClamp = "4";
            } else if (len < 120) {
                elTitle.style.fontSize = "4.8vh";
                elTitle.style.webkitLineClamp = "5";
            } else {
                elTitle.style.fontSize = "3.8vh";
                elTitle.style.webkitLineClamp = "6";
            }

            elQrCode.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(currentNews.link)}`;

            contentArea.classList.remove('fade-out');

            progressBar.style.transition = 'none';
            progressBar.style.transform = 'scaleX(0)';
            setTimeout(() => {
                progressBar.style.transition = `transform ${DISPLAY_DURATION}ms linear`;
                progressBar.style.transform = 'scaleX(1)';
            }, 50);

            currentIndex++;
        }, 800); 
    }

    async function loadNewsData() {
        try {
            const response = await fetch('./news.json?_=' + Date.now());
            if (response.ok) {
                const data = await response.json();
                if (Array.isArray(data) && data.length > 0) {
                    newsItems = data;
                }
            }
        } catch (e) {}

        if (loopInfo = true && loopInterval === null) {
            showNews();
            loopInterval = setInterval(showNews, DISPLAY_DURATION);
        }
    }

    loadNewsData();
    setInterval(loadNewsData, 600000);
</script>

</body>
</html>
