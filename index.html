<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - Sommariva del Bosco</title>
    <style>
        /* Variabili di colore: Modalità Scura */
        :root {
            --page-bg: #000000;
            --widget-bg: #1c1c1e;
            --widget-border: #2c2c2e;
            --text-main: #ffffff;
            --text-sec: #98989d;
            --accent-blue: #0a84ff;
            --accent-orange: #ff9f0a;
        }

        /* Variabili di colore: Modalità Chiara */
        body.light-mode {
            --page-bg: #e5e5ea; 
            --widget-bg: #ffffff;
            --widget-border: #d1d1d6;
            --text-main: #000000;
            --text-sec: #8e8e93;
            --accent-blue: #007aff;
            --accent-orange: #ff9500;
        }

        /* Layout fluido compatibile con VNNOX */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--page-bg);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #widget-container {
            position: relative;
            width: 96vw;  
            height: 94vh; 
            background-color: var(--widget-bg);
            border: 0.4vw solid var(--widget-border);
            border-radius: 4vh;
            padding: 4.5vh 4vw;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2vh 5vh rgba(0, 0, 0, 0.3);
        }

        #header {
            margin-bottom: 2.5vh;
            font-size: 5.5vh;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.1vw;
            line-height: 1;
        }

        #header .blue-text { color: var(--accent-blue); transition: color 1s ease; }
        #header .white-text { color: var(--text-main); transition: color 1s ease; }

        #content-area {
            flex: 1;
            display: flex;
            align-items: center; 
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
            overflow: hidden; 
        }

        .fade-out { opacity: 0 !important; }

        #news-image-wrapper {
            width: 36vw; 
            height: 58vh; 
            border-radius: 3vh;
            overflow: hidden;
            flex-shrink: 0;
            margin-right: 4vw;
            box-shadow: 0 1vh 3vh rgba(0,0,0,0.15);
            background-color: var(--widget-border);
        }

        #news-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #news-text-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            height: 58vh; 
            overflow: hidden;
            padding-right: 15vw; /* Spazio protetto per il QR code ingrandito */
        }

        #news-category {
            display: inline-block;
            font-size: 2.2vh;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-blue);
            background-color: rgba(10, 132, 255, 0.12);
            padding: 0.6vh 1.2vw;
            border-radius: 1vh;
            margin-bottom: 1.5vh;
            width: fit-content;
            letter-spacing: 0.05vw;
            transition: color 1s ease, background-color 1s ease;
        }

        #news-title {
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.15;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 1s ease, font-size 0.3s ease;
        }

        /* Area informazioni in basso (Fonte + Data staccata) */
        #news-meta {
            position: absolute;
            bottom: 3.5vh;
            left: 4vw; 
            display: flex;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        #news-source {
            font-size: 3vh;
            font-weight: 700;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            gap: 0.8vw;
            transition: color 1s ease;
        }

        #news-source::before {
            content: "(•)";
            font-size: 2vh;
            color: var(--text-sec);
            transition: color 1s ease;
        }

        #news-date {
            font-size: 2.8vh;
            font-weight: 600;
            color: var(--text-main);
            margin-left: 2.5vw;
            transition: color 1s ease;
        }

        /* Box QR Code INGRANDITO in basso a destra */
        #qr-container {
            position: absolute;
            bottom: 2.2vh;
            right: 4vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;
            padding: 1.2vh 1.2vw;
            border-radius: 1.8vh;
            box-shadow: 0 0.5vh 2vh rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        #qr-code {
            width: 14vh;  /* QR code ingrandito per una perfetta lettura sul LED wall */
            height: 14vh;
            object-fit: contain;
        }

        #qr-label {
            font-size: 1.7vh;
            font-weight: 700;
            color: #000000;
            margin-top: 0.6vh;
            text-transform: uppercase;
            letter-spacing: 0.05vw;
        }

        .show-content { opacity: 1 !important; }

        #progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0.8vh;
            background-color: transparent;
            border-bottom-left-radius: 4vh;
            border-bottom-right-radius: 4vh;
            overflow: hidden;
        }

        #progress-bar {
            width: 100%;
            height: 100%;
            background-color: var(--accent-blue);
            transform-origin: left;
            transform: scaleX(0);
            transition: transform linear;
        }
    </style>
</head>
<body>

<div id="widget-container">
    
    <div id="header">
        <span class="blue-text">SOMMARIVA DEL BOSCO</span> <span class="white-text">- NEWS</span>
    </div>
    
    <div id="content-area">
        <div id="news-image-wrapper">
            <img id="news-image" src="" alt="" onerror="this.src='https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=800&q=80'">
        </div>
        
        <div id="news-text-wrapper">
            <div id="news-category">Territorio</div>
            <div id="news-title">Caricamento notizie in corso...</div>
        </div>
    </div>

    <div id="news-meta" class="show-content">
        <div id="news-source">Sommariva News</div>
        <div id="news-date"></div>
    </div>

    <div id="qr-container" class="show-content">
        <img id="qr-code" src="" alt="QR">
        <div id="qr-label">Leggi</div>
    </div>

    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>

</div>

<script>
    function updateTheme() {
        const hour = new Date().getHours();
        if (hour >= 7 && hour < 19) {
            document.body.classList.add('light-mode');
        } else {
            document.body.classList.remove('light-mode');
        }
    }
    
    updateTheme();
    setInterval(updateTheme, 60000);

    const rssFeeds = [
        { name: "TargatoCN", url: "https://www.targatocn.it/rss.xml", limit: 4 },
        { name: "Gazzetta d'Alba", url: "https://www.gazzettadalba.it/feed/", limit: 4 },
        { name: "IdeaWebTV", url: "https://www.ideawebtv.it/feed/", limit: 4 },
        { name: "La Guida", url: "https://www.laguida.it/feed/", limit: 3 }
    ];

    // NOTIZIE DI RISERVA LOCALI (con il link del comune aggiornato)
    let newsItems = [
        { source: "Sommariva News", category: "Territorio", title: "Aggiornamenti in tempo reale dal territorio di Sommariva del Bosco e del Roero", image: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=800&q=80", link: "https://www.comune.sommalombardo.cn.it", pubDate: new Date() },
        { source: "Eventi Locali", category: "Cultura", title: "Tutti gli appuntamenti, le fiere e le manifestazioni culturali in programma", image: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=800&q=80", link: "https://www.comune.sommalombardo.cn.it", pubDate: new Date() },
        { source: "Notizie del Territorio", category: "Cronaca", title: "Cronaca, sport e informazioni utili per la comunità locale", image: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80", link: "https://www.comune.sommalombardo.cn.it", pubDate: new Date() }
    ];

    let currentIndex = 0;
    const DISPLAY_DURATION = 15000; 

    const contentArea = document.getElementById('content-area');
    const elMeta = document.getElementById('news-meta');
    const qrContainer = document.getElementById('qr-container');
    const imageWrapper = document.getElementById('news-image-wrapper');
    const textWrapper = document.getElementById('news-text-wrapper');
    const elImage = document.getElementById('news-image');
    const elCategory = document.getElementById('news-category');
    const elTitle = document.getElementById('news-title');
    const elSource = document.getElementById('news-source');
    const elDate = document.getElementById('news-date');
    const elQrCode = document.getElementById('qr-code');
    const progressBar = document.getElementById('progress-bar');

    const spamKeywords = [
        "dottore", "dott.", "dott.ssa", "medico", "farmacia", "poliambulatorio", 
        "visita specialistica", "pubblicità", "promozione", "sponsorizzato", 
        "offerta", "sconto", "commerciale", "marketing", "dentista", "clinica"
    ];

    function cleanHTML(html) {
        if (!html) return "";
        let tmp = document.createElement("DIV");
        tmp.innerHTML = html;
        return (tmp.textContent || tmp.innerText || "").trim();
    }

    function formatTitle(title) {
        let clean = cleanHTML(title);
        clean = clean.replace(/\s*[-|]\s*[a-zA-Z0-9.-]+\.[a-zA-Z]{2,5}$/i, '');
        clean = clean.replace(/\s*[-|]\s*[A-Z][a-zA-Z\s]+$/i, '');
        return clean.trim();
    }

    function getCategory(title) {
        let t = title.toLowerCase();
        if (/calcio|partita|mister|serie|volley|pallavolo|sport|squadra|gol|vittoria|sconfitta/i.test(t)) return "Sport";
        if (/cibo|slow|vino|tartufo|mercato|sapori|ristorante|fiera|formaggio|degustazione/i.test(t)) return "Eventi & Food";
        if (/comune|sindaco|regione|politica|consiglio|amministrazione|elezioni/i.test(t)) return "Territorio";
        if (/premio|teatro|cinema|mostra|spettacolo|libri|concerto/i.test(t)) return "Cultura";
        return "Cronaca";
    }

    function formatFriendlyDate(dateObj) {
        if (!dateObj || isNaN(dateObj)) return "";
        const now = new Date();
        const diffHours = Math.floor((now - dateObj) / (1000 * 60 * 60));
        
        if (diffHours < 1) return "Pubblicato poco fa";
        if (diffHours < 24 && now.getDate() === dateObj.getDate()) {
            return `Oggi alle ${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
        }
        if (diffHours < 48) return "Ieri";
        return `${dateObj.getDate()}/${dateObj.getMonth() + 1}/${dateObj.getFullYear()}`;
    }

    function isAdOrSpam(title, description) {
        let content = (title + " " + description).toLowerCase();
        return spamKeywords.some(keyword => content.includes(keyword));
    }

    function isDuplicate(newTitle, existingNews) {
        let newWords = newTitle.toLowerCase().split(/\W+/).filter(w => w.length > 4);
        for (let item of existingNews) {
            let existingWords = item.title.toLowerCase().split(/\W+/).filter(w => w.length > 4);
            let matches = 0;
            for (let word of newWords) {
                if (existingWords.includes(word)) matches++;
            }
            if (matches >= 3 && newWords.length > 0) return true;
        }
        return false;
    }

    const NEWS_DEFAULT_IMAGE = "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=800&q=80";

    function extractImage(item, sourceName) {
        if (sourceName === "Gazzetta d'Alba") {
            return NEWS_DEFAULT_IMAGE;
        }
        let imgUrl = "";
        if (item.thumbnail && item.thumbnail.trim() !== "") {
            imgUrl = item.thumbnail;
        } else if (item.enclosure && item.enclosure.link && item.enclosure.type && item.enclosure.type.startsWith('image/')) {
            imgUrl = item.enclosure.link;
        } else {
            const imgRegex = /<img[^>]+src="?([^"\s]+)"?[^>]*>/g;
            let match = imgRegex.exec(item.content || item.description);
            if (match && match[1]) imgUrl = match[1];
        }
        if (!imgUrl || imgUrl.length < 10 || /feedburner|1x1|pixel|tracker|blank|hotlinked|stop|error|warning|default/i.test(imgUrl)) {
            return NEWS_DEFAULT_IMAGE;
        }
        return imgUrl;
    }

    async function fetchAllNews() {
        let tempNews = [];

        for (const feed of rssFeeds) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);

                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
                const response = await fetch(apiUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                const data = await response.json();

                if (data.status === 'ok') {
                    const items = data.items.slice(0, feed.limit); 
                    items.forEach(item => {
                        let rawText = item.content ? item.content : item.description;
                        let cleanText = cleanHTML(rawText);
                        let cleanTitle = formatTitle(item.title);
                        
                        if (isAdOrSpam(cleanTitle, cleanText)) return;
                        if (isDuplicate(cleanTitle, tempNews)) return;
                        
                        tempNews.push({
                            source: feed.name,
                            category: getCategory(cleanTitle),
                            title: cleanTitle,
                            image: extractImage(item, feed.name),
                            link: item.link || "https://www.comune.sommarivadelbosco.cn.it",
                            pubDate: new Date(item.pubDate)
                        });
                    });
                }
            } catch (error) {}
        }

        if (tempNews.length > 0) {
            tempNews.sort((a, b) => b.pubDate - a.pubDate);
            newsItems = tempNews.slice(0, 15);
        }
    }

    function runProgressBar() {
        progressBar.style.transition = 'none';
        progressBar.style.transform = 'scaleX(0)';
        setTimeout(() => {
            progressBar.style.transition = `transform ${DISPLAY_DURATION}ms linear`;
            progressBar.style.transform = 'scaleX(1)';
        }, 50);
    }

    function showNews() {
        if (newsItems.length === 0) return;

        const currentNews = newsItems[currentIndex];
        
        contentArea.classList.add('fade-out');
        elMeta.classList.remove('show-content');
        qrContainer.classList.remove('show-content');

        setTimeout(() => {
            elImage.src = currentNews.image;
            elCategory.textContent = currentNews.category;
            elSource.textContent = "Fonte: " + currentNews.source;
            elDate.textContent = formatFriendlyDate(currentNews.pubDate);
            elTitle.textContent = currentNews.title;
            
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(currentNews.link)}`;
            elQrCode.src = qrApiUrl;

            let len = currentNews.title.length;
            if (len < 35) {
                elTitle.style.fontSize = "7.5vh"; 
            } else if (len < 65) {
                elTitle.style.fontSize = "6.5vh"; 
            } else if (len < 100) {
                elTitle.style.fontSize = "5.5vh"; 
            } else if (len < 145) {
                elTitle.style.fontSize = "4.5vh"; 
            } else {
                elTitle.style.fontSize = "3.8vh"; 
            }

            contentArea.classList.remove('fade-out');
            elMeta.classList.add('show-content');
            qrContainer.classList.add('show-content');

            runProgressBar();

            currentIndex++;
            if (currentIndex >= newsItems.length) currentIndex = 0;
            
        }, 800); 
    }

    showNews();
    setInterval(showNews, DISPLAY_DURATION);

    fetchAllNews();
    setInterval(fetchAllNews, 3600000); 

</script>

</body>
</html>
