<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Locali - Sommariva del Bosco</title>
    <style>
        /* Variabili di colore: Modalità Scura */
        :root {
            --page-bg: #000000;
            --widget-bg: #11151e;
            --widget-border: #1f2533;
            --text-main: #ffffff;
            --text-sec: #9ca3af;
            --accent-blue: #38bdf8;
            --accent-orange: #f59e0b;
        }

        /* Variabili di colore: Modalità Chiara */
        body.light-mode {
            --page-bg: #ffffff;
            --widget-bg: #f8fafc;
            --widget-border: #e2e8f0;
            --text-main: #0f172a;
            --text-sec: #64748b;
            --accent-blue: #0284c7;
            --accent-orange: #d97706;
        }

        /* Layout generale e centramento */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--page-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 1s ease;
        }

        #scaler {
            width: 1240px;
            height: 700px;
            transform: scale(0.55);
            transform-origin: center;
            display: flex;
        }

        #widget-container {
            position: relative; 
            width: 100%;
            height: 100%;
            background-color: var(--widget-bg);
            border: 2px solid var(--widget-border);
            border-radius: 32px;
            padding: 40px 45px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 1s ease;
        }

        #header {
            margin-bottom: 35px;
            font-size: 46px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1;
        }

        #header .blue-text { color: var(--accent-blue); }
        #header .white-text { color: var(--text-main); }

        #content-area {
            flex: 1;
            display: flex;
            gap: 45px; 
            align-items: flex-start;
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
            padding-left: 10px;
        }

        .fade-out { opacity: 0 !important; }

        #news-image-wrapper {
            width: 400px;
            height: 340px; 
            border-radius: 20px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background-color: var(--widget-border);
            margin-top: 5px;
        }

        #news-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #news-text-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-right: 20px;
            height: 480px; 
            overflow: hidden;
        }

        #news-title {
            font-size: 50px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.15;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 4; /* Margine massimo per titoli molto lunghi */
            line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        #news-description {
            font-size: 27px;
            color: var(--text-sec);
            line-height: 1.45;
            /* Rimosso il line-clamp CSS, ora la lunghezza la gestisce il Javascript a frasi intere */
        }

        #news-source {
            position: absolute;
            bottom: 40px;
            left: 55px; 
            font-size: 26px;
            font-weight: 700;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        #news-source::before {
            content: "(•)";
            font-size: 18px;
            color: var(--text-sec);
        }

        .show-content { opacity: 1 !important; }

        #loading-message {
            font-size: 32px;
            color: var(--text-sec);
            text-align: center;
            width: 100%;
            font-weight: 500;
            margin-top: 100px;
        }
    </style>
</head>
<body>

<div id="scaler">
    <div id="widget-container">
        
        <div id="header">
            <span class="blue-text">SOMMARIVA DEL BOSCO</span> <span class="white-text">- NEWS LOCALI</span>
        </div>
        
        <div id="content-area">
            <div id="loading-message">Sincronizzazione notizie in corso...</div>
            
            <div id="news-image-wrapper" style="display: none;">
                <!-- Immagine di fallback assoluta in caso di errore di caricamento -->
                <img id="news-image" src="" alt="" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'">
            </div>
            
            <div id="news-text-wrapper" style="display: none;">
                <div id="news-title">Titolo</div>
                <div id="news-description">Descrizione...</div>
            </div>
        </div>

        <div id="news-source">Fonte</div>

    </div>
</div>

<script>
    function updateTheme() {
        const hour = new Date().getHours();
        if (hour >= 7 && hour < 19) {
            document.body.classList.add('light-mode');
        } else {
            document.body.classList.remove('light-mode');
        }
    }
    
    updateTheme();
    setInterval(updateTheme, 60000);

    const rssFeeds = [
        { name: "TargatoCN", url: "https://www.targatocn.it/rss.xml", limit: 4 },
        { name: "Gazzetta d'Alba", url: "https://www.gazzettadalba.it/feed/", limit: 4 },
        { name: "IdeaWebTV", url: "https://www.ideawebtv.it/feed/", limit: 4 },
        { name: "La Guida", url: "https://www.laguida.it/feed/", limit: 3 }
    ];

    let newsItems = [];
    let currentIndex = 0;
    const DISPLAY_DURATION = 15000; 

    const contentArea = document.getElementById('content-area');
    const elSource = document.getElementById('news-source');
    const loadingMessage = document.getElementById('loading-message');
    const imageWrapper = document.getElementById('news-image-wrapper');
    const textWrapper = document.getElementById('news-text-wrapper');
    const elImage = document.getElementById('news-image');
    const elTitle = document.getElementById('news-title');
    const elDesc = document.getElementById('news-description');

    const spamKeywords = [
        "dottore", "dott.", "dott.ssa", "medico", "farmacia", "poliambulatorio", 
        "visita specialistica", "pubblicità", "promozione", "sponsorizzato", 
        "offerta", "sconto", "commerciale", "marketing", "dentista", "clinica"
    ];

    function cleanHTML(html) {
        if (!html) return "";
        let tmp = document.createElement("DIV");
        tmp.innerHTML = html;
        return (tmp.textContent || tmp.innerText || "").trim();
    }

    function formatTitle(title, sourceName) {
        let clean = cleanHTML(title);
        clean = clean.replace(/\s*[-|]\s*[a-zA-Z0-9.-]+\.[a-zA-Z]{2,5}$/i, '');
        clean = clean.replace(/\s*[-|]\s*[A-Z][a-zA-Z\s]+$/i, '');
        return clean.trim();
    }

    function isAdOrSpam(title, description) {
        let content = (title + " " + description).toLowerCase();
        return spamKeywords.some(keyword => content.includes(keyword));
    }

    function isDuplicate(newTitle, existingNews) {
        let newWords = newTitle.toLowerCase().split(/\W+/).filter(w => w.length > 4);
        for (let item of existingNews) {
            let existingWords = item.title.toLowerCase().split(/\W+/).filter(w => w.length > 4);
            let matches = 0;
            for (let word of newWords) {
                if (existingWords.includes(word)) matches++;
            }
            if (matches >= 3 && newWords.length > 0) return true;
        }
        return false;
    }

    // NUOVO ALGORITMO RIASSUNTO: Crea una descrizione perfetta a frasi intere, senza eccedere
    function buildSmartSummary(text) {
        // Pulisce puntini fastidiosi
        text = text.replace(/\.{2,}/g, '').trim(); 
        
        // Divide in singole frasi basandosi sul punto fermo
        let sentences = text.split('. ');
        let summary = "";
        const MAX_CHARS = 240; // Limite di sicurezza per non sforare mai in verticale (max ~4 righe)

        for (let i = 0; i < sentences.length; i++) {
            let sentence = sentences[i].trim();
            if (!sentence) continue;
            
            // Rimette il punto a fine frase
            if (!sentence.endsWith('.')) sentence += '.';
            
            // Se aggiungendo questa frase superiamo lo spazio massimo...
            if ((summary.length + sentence.length) > MAX_CHARS) {
                // ...se abbiamo già almeno una frase completa salvata, ci fermiamo qui (riassunto perfetto).
                if (summary.length > 0) {
                    break;
                } 
                // ...se invece la primissima frase è lunghissima e sfora da sola, siamo costretti a tagliarla.
                else {
                    let words = sentence.split(' ');
                    let temp = "";
                    for(let w of words) {
                        if (temp.length + w.length > (MAX_CHARS - 10)) break;
                        temp += w + " ";
                    }
                    summary = temp.trim() + "...";
                    break;
                }
            }
            
            summary += (summary.length > 0 ? " " : "") + sentence;
        }
        
        return summary || "Dettagli aggiuntivi non disponibili.";
    }

    // FILTRO IMMAGINI POTENZIATO: Scarta pixel di tracciamento e immagini rotte
    function extractImage(item) {
        let imgUrl = "";
        
        if (item.thumbnail && item.thumbnail.trim() !== "") {
            imgUrl = item.thumbnail;
        } else if (item.enclosure && item.enclosure.link && item.enclosure.type.startsWith('image/')) {
            imgUrl = item.enclosure.link;
        } else {
            const imgRegex = /<img[^>]+src="?([^"\s]+)"?[^>]*>/g;
            let match = imgRegex.exec(item.content || item.description);
            if (match && match[1]) imgUrl = match[1];
        }

        // Se non c'è url o se contiene parole tipiche dei pixel di tracciamento invisibili (feedburner, 1x1, pixel, tracker)
        if (!imgUrl || imgUrl.length < 10 || /feedburner|1x1|pixel|tracker|blank/i.test(imgUrl)) {
            // Immagine di repertorio bellissima a tema "News/Lettura"
            return "https://images.unsplash.com/photo-1504711434969-e33886168f5c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80";
        }
        return imgUrl;
    }

    async function fetchAllNews() {
        let tempNews = [];

        for (const feed of rssFeeds) {
            try {
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok') {
                    const items = data.items.slice(0, feed.limit); 
                    
                    items.forEach(item => {
                        let rawText = item.content ? item.content : item.description;
                        let cleanText = cleanHTML(rawText);
                        let cleanTitle = formatTitle(item.title, feed.name);
                        
                        if (isAdOrSpam(cleanTitle, cleanText)) return;
                        if (isDuplicate(cleanTitle, tempNews)) return;
                        
                        tempNews.push({
                            source: feed.name,
                            title: cleanTitle,
                            description: buildSmartSummary(cleanText),
                            image: extractImage(item),
                            pubDate: new Date(item.pubDate)
                        });
                    });
                }
            } catch (error) {
                console.error("Errore feed:", feed.name);
            }
        }

        if (tempNews.length > 0) {
            tempNews.sort((a, b) => b.pubDate - a.pubDate);
            newsItems = tempNews.slice(0, 15);
            currentIndex = 0;
            showNews();
        } else {
            loadingMessage.innerHTML = "Notizie non disponibili al momento.";
        }
    }

    function showNews() {
        if (newsItems.length === 0) return;

        const currentNews = newsItems[currentIndex];
        loadingMessage.style.display = 'none';
        
        contentArea.classList.add('fade-out');
        elSource.classList.remove('show-content');

        setTimeout(() => {
            elImage.src = currentNews.image;
            elSource.textContent = "Fonte: " + currentNews.source;
            elTitle.textContent = currentNews.title;
            elDesc.textContent = currentNews.description;

            imageWrapper.style.display = 'block';
            textWrapper.style.display = 'flex';

            contentArea.classList.remove('fade-out');
            elSource.classList.add('show-content');

            currentIndex++;
            if (currentIndex >= newsItems.length) currentIndex = 0;
            
        }, 800); 
    }

    fetchAllNews();
    setInterval(showNews, DISPLAY_DURATION);
    setInterval(fetchAllNews, 3600000); 

</script>

</body>
</html>
