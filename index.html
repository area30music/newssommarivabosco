<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Locali - Sommariva del Bosco</title>
    <style>
        /* Variabili di colore: Modalità Scura */
        :root {
            --page-bg: #000000;
            --widget-bg: #11151e;
            --widget-border: #1f2533;
            --text-main: #ffffff;
            --text-sec: #9ca3af;
            --accent-blue: #38bdf8;
            --accent-orange: #f59e0b;
        }

        /* Variabili di colore: Modalità Chiara */
        body.light-mode {
            --page-bg: #ffffff;
            --widget-bg: #f8fafc;
            --widget-border: #e2e8f0;
            --text-main: #0f172a;
            --text-sec: #64748b;
            --accent-blue: #0284c7;
            --accent-orange: #d97706;
        }

        /* Layout generale e centramento */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--page-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 1s ease;
        }

        #scaler {
            width: 1240px;
            height: 700px;
            transform: scale(0.55);
            transform-origin: center;
            display: flex;
        }

        #widget-container {
            position: relative; 
            width: 100%;
            height: 100%;
            background-color: var(--widget-bg);
            border: 2px solid var(--widget-border);
            border-radius: 32px;
            padding: 40px 45px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 1s ease;
        }

        #header {
            margin-bottom: 35px;
            font-size: 46px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1;
        }

        #header .blue-text { color: var(--accent-blue); }
        #header .white-text { color: var(--text-main); }

        #content-area {
            flex: 1;
            display: flex;
            gap: 45px; 
            align-items: flex-start;
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
            padding-left: 10px;
        }

        .fade-out { opacity: 0 !important; }

        #news-image-wrapper {
            width: 400px;
            height: 340px; 
            border-radius: 20px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background-color: var(--widget-border);
            margin-top: 5px;
        }

        #news-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #news-text-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-right: 20px;
            height: 480px; 
            overflow: hidden;
        }

        #news-title {
            font-size: 50px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.15;
            margin-bottom: 20px;
        }

        #news-description {
            font-size: 27px;
            color: var(--text-sec);
            line-height: 1.45;
        }

        #news-source {
            position: absolute;
            bottom: 40px;
            left: 55px; 
            font-size: 26px;
            font-weight: 700;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        #news-source::before {
            content: "(•)";
            font-size: 18px;
            color: var(--text-sec);
        }

        .show-content { opacity: 1 !important; }

        #loading-message {
            font-size: 32px;
            color: var(--text-sec);
            text-align: center;
            width: 100%;
            font-weight: 500;
            margin-top: 100px;
        }
    </style>
</head>
<body>

<div id="scaler">
    <div id="widget-container">
        
        <div id="header">
            <span class="blue-text">SOMMARIVA DEL BOSCO</span> <span class="white-text">- NEWS LOCALI</span>
        </div>
        
        <div id="content-area">
            <div id="loading-message">Sincronizzazione notizie in corso...</div>
            
            <div id="news-image-wrapper" style="display: none;">
                <!-- Aggiunto onerror: se la foto è rotta o cancellata, mette subito quella di repertorio -->
                <img id="news-image" src="" alt="" onerror="this.src='https://images.unsplash.com/photo-1596395819057-cb34d4a8264d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'">
            </div>
            
            <div id="news-text-wrapper" style="display: none;">
                <div id="news-title">Titolo</div>
                <div id="news-description">Descrizione...</div>
            </div>
        </div>

        <div id="news-source">Fonte</div>

    </div>
</div>

<script>
    function updateTheme() {
        const hour = new Date().getHours();
        if (hour >= 7 && hour < 19) {
            document.body.classList.add('light-mode');
        } else {
            document.body.classList.remove('light-mode');
        }
    }
    
    updateTheme();
    setInterval(updateTheme, 60000);

    // =======================================================================
    // IMPOSTAZIONI DEI FEED - PONTE INTEGRATO
    // =======================================================================
    const rssFeeds = [
        // Ponte automatico per prendere solo gli ultimi due eventi/notizie istituzionali di Sommariva
        { name: "Comune Sommariva Bosco", url: "https://news.google.com/rss/search?q=Sommariva+del+Bosco+eventi+OR+comune+OR+cronaca+OR+istituzionale&hl=it&gl=IT&ceid=IT:it", isLocal: true, limit: 2 },
        // Altre fonti
        { name: "TargatoCN", url: "https://www.targatocn.it/rss.xml", isLocal: false, limit: 3 },
        { name: "Gazzetta d'Alba", url: "https://www.gazzettadalba.it/feed/", isLocal: false, limit: 3 },
        { name: "IdeaWebTV", url: "https://www.ideawebtv.it/feed/", isLocal: false, limit: 2 },
        { name: "La Guida", url: "https://www.laguida.it/feed/", isLocal: false, limit: 2 }
    ];

    let newsItems = [];
    let currentIndex = 0;
    const DISPLAY_DURATION = 15000; // 15 secondi a notizia

    const contentArea = document.getElementById('content-area');
    const elSource = document.getElementById('news-source');
    const loadingMessage = document.getElementById('loading-message');
    const imageWrapper = document.getElementById('news-image-wrapper');
    const textWrapper = document.getElementById('news-text-wrapper');
    const elImage = document.getElementById('news-image');
    const elTitle = document.getElementById('news-title');
    const elDesc = document.getElementById('news-description');

    // Filtro anti-pubblicità
    const spamKeywords = [
        "dottore", "dott.", "dott.ssa", "medico", "farmacia", "poliambulatorio", 
        "visita specialistica", "pubblicità", "promozione", "sponsorizzato", 
        "offerta", "sconto", "commerciale", "marketing", "dentista", "clinica"
    ];

    function cleanHTML(html) {
        if (!html) return "";
        let tmp = document.createElement("DIV");
        tmp.innerHTML = html;
        return (tmp.textContent || tmp.innerText || "").trim();
    }

    // Pulisce il titolo dai " - nomesito.it" o " | Nomesito"
    function formatTitle(title, sourceName) {
        let clean = cleanHTML(title);
        // Rimuove la dicitura " - nomesito.it" o simili dalla fine
        clean = clean.replace(/\s*[-|]\s*[a-zA-Z0-9.-]+\.[a-zA-Z]{2,5}$/i, '');
        // Rimuove il nome della fonte se è incollato nel titolo
        const sourceRegex = new RegExp(`\\s*[-|]\\s*${sourceName}`, 'i');
        clean = clean.replace(sourceRegex, '');
        return clean.trim();
    }

    function isAdOrSpam(title, description) {
        let content = (title + " " + description).toLowerCase();
        return spamKeywords.some(keyword => content.includes(keyword));
    }

    function isDuplicate(newTitle, existingNews) {
        let newWords = newTitle.toLowerCase().split(/\W+/).filter(w => w.length > 4);
        
        for (let item of existingNews) {
            let existingWords = item.title.toLowerCase().split(/\W+/).filter(w => w.length > 4);
            let matches = 0;
            
            for (let word of newWords) {
                if (existingWords.includes(word)) matches++;
            }
            
            if (matches >= 3 && newWords.length > 0) {
                return true;
            }
        }
        return false;
    }

    function formatDescription(text) {
        text = text.replace(/\.{3}$|\[\.\.\.\]$\vert{}\.\.\.$/g, '').trim();
        const MAX_LENGTH = 600; 
        
        if (text.length <= MAX_LENGTH) {
            return text.endsWith('.') ? text : text + '.';
        }
        
        let truncated = text.substring(0, MAX_LENGTH);
        let lastPeriodIndex = truncated.lastIndexOf('.');
        
        if (lastPeriodIndex > (MAX_LENGTH * 0.4)) {
            return truncated.substring(0, lastPeriodIndex + 1);
        } else {
            let lastSpaceIndex = truncated.lastIndexOf(' ');
            return (lastSpaceIndex > 0 ? truncated.substring(0, lastSpaceIndex) : truncated) + '.';
        }
    }

    function extractImage(item) {
        if (item.thumbnail && item.thumbnail.trim() !== "") return item.thumbnail;
        if (item.enclosure && item.enclosure.link && item.enclosure.type.startsWith('image/')) return item.enclosure.link;
        const imgRegex = /<img[^>]+src="?([^"\s]+)"?[^>]*>/g;
        let match = imgRegex.exec(item.content || item.description);
        if (match && match[1]) return match[1];
        // Immagine neutrale a tema territoriale come repertorio standard
        return "https://images.unsplash.com/photo-1596395819057-cb34d4a8264d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80";
    }

    async function fetchAllNews() {
        let tempNews = [];

        for (const feed of rssFeeds) {
            try {
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok') {
                    const items = data.items.slice(0, feed.limit); 
                    
                    items.forEach(item => {
                        let rawText = item.content ? item.content : item.description;
                        let cleanText = cleanHTML(rawText);
                        let cleanTitle = formatTitle(item.title, feed.name);
                        
                        // Scarta spam e doppioni
                        if (isAdOrSpam(cleanTitle, cleanText)) return;
                        if (isDuplicate(cleanTitle, tempNews)) return;
                        
                        tempNews.push({
                            source: feed.name,
                            title: cleanTitle,
                            description: formatDescription(cleanText),
                            image: extractImage(item),
                            pubDate: new Date(item.pubDate),
                            isLocal: feed.isLocal
                        });
                    });
                }
            } catch (error) {
                console.error("Errore feed:", feed.name);
            }
        }

        if (tempNews.length > 0) {
            // Ordina: le notizie locali istituzionali vanno per prime
            tempNews.sort((a, b) => {
                if (a.isLocal && !b.isLocal) return -1;
                if (!a.isLocal && b.isLocal) return 1;
                return b.pubDate - a.pubDate;
            });

            newsItems = tempNews.slice(0, 15);
            currentIndex = 0;
            showNews();
        } else {
            loadingMessage.innerHTML = "Notizie non disponibili al momento.";
        }
    }

    function showNews() {
        if (newsItems.length === 0) return;

        const currentNews = newsItems[currentIndex];
        loadingMessage.style.display = 'none';
        
        contentArea.classList.add('fade-out');
        elSource.classList.remove('show-content');

        setTimeout(() => {
            // Imposta l'immagine (se l'URL non è valido, entra in gioco l'onerror sull'HTML)
            elImage.src = currentNews.image;
            elSource.textContent = "Fonte: " + currentNews.source;
            elTitle.textContent = currentNews.title;
            elDesc.textContent = currentNews.description;

            imageWrapper.style.display = 'block';
            textWrapper.style.display = 'flex';

            contentArea.classList.remove('fade-out');
            elSource.classList.add('show-content');

            currentIndex++;
            if (currentIndex >= newsItems.length) currentIndex = 0;
            
        }, 800); 
    }

    fetchAllNews();
    setInterval(showNews, DISPLAY_DURATION);
    setInterval(fetchAllNews, 3600000); 

</script>

</body>
</html>
