<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Locali LEDwall</title>
    <style>
        /* Azzera i margini e nasconde le barre di scorrimento del browser */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000; /* Sfondo nero utile per i bordi fuori scala */
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Contenitore principale con le misure esatte richieste */
        #widget-container {
            width: 1240px;
            height: 700px;
            background-color: #111;
            /* Scalatura a 0.55 con origine in alto a sinistra */
            transform: scale(0.55);
            transform-origin: top left;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            color: #fff;
            box-sizing: border-box;
        }

        /* Fascia superiore con il titolo */
        #header {
            height: 110px;
            background-color: #cc0000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Area dove compare la notizia */
        #content-area {
            flex: 1;
            padding: 40px 50px;
            display: flex;
            gap: 50px;
            align-items: center;
            /* Transizione fluida per il cambio notizia */
            opacity: 1;
            transition: opacity 1s ease-in-out;
        }

        /* Classe aggiunta da JS per l'effetto dissolvenza */
        .fade-out {
            opacity: 0 !important;
        }

        /* Contenitore della foto */
        #news-image-container {
            width: 450px;
            height: 400px;
            flex-shrink: 0;
            background-color: #222;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #news-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Taglia l'immagine in modo da riempire il riquadro senza deformarla */
        }

        /* Testata giornalistica posizionata sopra la foto */
        #news-source-badge {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #ffcc00;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 28px;
            font-weight: bold;
        }

        /* Area del testo */
        #news-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Titolo della notizia */
        #news-title {
            font-size: 52px;
            line-height: 1.2;
            font-weight: bold;
            margin-bottom: 25px;
            /* Limita il titolo a max 3 righe */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Descrizione breve della notizia */
        #news-description {
            font-size: 34px;
            line-height: 1.4;
            color: #b0b0b0;
            /* Limita la descrizione a max 2/3 righe */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Messaggio iniziale */
        #loading-message {
            font-size: 40px;
            text-align: center;
            width: 100%;
            color: #888;
        }
    </style>
</head>
<body>

<div id="widget-container">
    <div id="header">
        News Locali - Sommariva del Bosco e dintorni
    </div>
    
    <div id="content-area">
        <div id="loading-message">Caricamento notizie in corso...</div>
        
        <!-- Questi elementi sono nascosti finché non arrivano i dati -->
        <div id="news-image-container" style="display: none;">
            <img id="news-image" src="" alt="News Image">
            <div id="news-source-badge">Fonte</div>
        </div>
        <div id="news-text" style="display: none;">
            <div id="news-title">Titolo Notizia</div>
            <div id="news-description">Descrizione della notizia...</div>
        </div>
    </div>
</div>

<script>
    // Le fonti RSS locali
    const rssFeeds = [
        { name: "TargatoCN", url: "https://www.targatocn.it/rss.xml" },
        { name: "Gazzetta d'Alba", url: "https://www.gazzettadalba.it/feed/" },
        { name: "IdeaWebTV", url: "https://www.ideawebtv.it/feed/" },
        { name: "Cuneo24", url: "https://www.cuneo24.it/feed/" },
        { name: "La Guida", url: "https://www.laguida.it/feed/" },
        { name: "ANSA Piemonte", url: "https://www.ansa.it/piemonte/notizie/piemonte_rss.xml" }
    ];

    let newsItems = [];
    let currentIndex = 0;
    const DISPLAY_DURATION_MS = 30000; // 30 secondi per ogni notizia

    const contentArea = document.getElementById('content-area');
    const loadingMessage = document.getElementById('loading-message');
    const imageContainer = document.getElementById('news-image-container');
    const textContainer = document.getElementById('news-text');
    
    const newsImage = document.getElementById('news-image');
    const newsSourceBadge = document.getElementById('news-source-badge');
    const newsTitle = document.getElementById('news-title');
    const newsDescription = document.getElementById('news-description');

    // Funzione per pulire la descrizione da codici HTML (es. <p>, <a>, <img>)
    function stripHtmlAndTruncate(html) {
        let tmp = document.createElement("DIV");
        tmp.innerHTML = html;
        let text = tmp.textContent || tmp.innerText || "";
        return text.trim();
    }

    // Funzione per estrarre l'immagine
    function extractImage(item) {
        if (item.thumbnail && item.thumbnail.trim() !== "") return item.thumbnail;
        if (item.enclosure && item.enclosure.link && item.enclosure.type.startsWith('image/')) return item.enclosure.link;
        // Cerca un'immagine dentro il contenuto HTML dell'articolo
        const imgRegex = /<img[^>]+src="?([^"\s]+)"?[^>]*>/g;
        let match = imgRegex.exec(item.content || item.description);
        if (match && match[1]) return match[1];
        // Immagine di fallback neutra se non c'è foto
        return "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80";
    }

    async function fetchAllNews() {
        let tempNews = [];

        for (const feed of rssFeeds) {
            try {
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok') {
                    // Prendi solo le prime 2/3 notizie per fonte per arrivare a ~15 totali
                    const items = data.items.slice(0, 3); 
                    items.forEach(item => {
                        tempNews.push({
                            source: feed.name,
                            title: item.title,
                            description: stripHtmlAndTruncate(item.description),
                            image: extractImage(item),
                            pubDate: new Date(item.pubDate)
                        });
                    });
                }
            } catch (error) {
                console.error("Errore nel caricamento del feed:", feed.name);
            }
        }

        if (tempNews.length > 0) {
            // Ordina le notizie dalla più recente alla più vecchia
            tempNews.sort((a, b) => b.pubDate - a.pubDate);
            // Limitiamo a un massimo di 15 notizie in totale
            newsItems = tempNews.slice(0, 15);
            
            // Inizia il ciclo
            currentIndex = 0;
            showNews();
        } else {
            loadingMessage.innerHTML = "Impossibile caricare le notizie in questo momento.";
        }
    }

    function showNews() {
        if (newsItems.length === 0) return;

        const currentNews = newsItems[currentIndex];

        // Nasconde il loading
        loadingMessage.style.display = 'none';
        
        // Applica l'effetto dissolvenza per nascondere la notizia precedente
        contentArea.classList.add('fade-out');

        setTimeout(() => {
            // Cambia i contenuti mentre è in dissolvenza (invisibile)
            newsImage.src = currentNews.image;
            newsSourceBadge.textContent = currentNews.source;
            newsTitle.textContent = currentNews.title;
            newsDescription.textContent = currentNews.description;

            imageContainer.style.display = 'flex';
            textContainer.style.display = 'flex';

            // Fa ricomparire la nuova notizia
            contentArea.classList.remove('fade-out');

            // Prepara il prossimo indice
            currentIndex++;
            if (currentIndex >= newsItems.length) {
                currentIndex = 0; // Ricomincia da capo
            }
        }, 1000); // 1 secondo di transizione per il fade-out
    }

    // Avvia la prima lettura
    fetchAllNews();

    // Cambia notizia ogni 30 secondi
    setInterval(showNews, DISPLAY_DURATION_MS);

    // Ricarica nuovi feed dai siti ogni 2 ore per mantenere le notizie fresche 
    // (senza ricaricare la pagina web)
    setInterval(fetchAllNews, 7200000);

</script>

</body>
</html>
